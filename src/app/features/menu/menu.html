<section class="menu-page container">
  <h2>🍽️ قائمة الطعام</h2>
  <p class="subtitle">تذوق أشهى المأكولات اللبنانية الأصيلة، محضرة بحب وشغف</p>

  <div class="category-filters">
    <button (click)="filterMenu(undefined)" [class.active]="selectedCategory === undefined">الكل</button>
    
    <button
      *ngFor="let cat of categories"
      (click)="filterMenu($any(cat))" 
      [class.active]="selectedCategory === cat"
    >
      {{ cat | titlecase }}
    </button>
  </div>

  <div class="menu-grid">
    <div class="menu-card" *ngFor="let item of filteredMenu">
      <img [src]="item.imageUrl" [alt]="item.name_ar" loading="eager" class="card-image">
      <div class="card-content">
        <h3>{{ item.name_ar }} <span>({{ item.name_en }})</span></h3>
        <p class="description">{{ item.description_ar }}</p>

        <div class="price-wrapper">
          
          <div *ngIf="item.options && item.options.length > 0">
            <div *ngFor="let opt of item.options" class="option-row">
              <span class="option-name">{{ opt.label_ar }}</span>
              <span class="option-price">{{ opt.price | number:'1.3-3' }} دع</span>
            </div>
          </div>

          <div *ngIf="!item.options || item.options.length === 0" class="price">
            {{ item.price | number:'1.3-3' }} دع
          </div>

        </div>
        </div>
    </div>
  </div>
</section>
